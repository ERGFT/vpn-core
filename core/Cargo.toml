[package]
name = "reality-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Ядро клиента VLESS/REALITY/XTLS Vision: входы, маршрутизация, выходы, транспорты"

[lib]
name = "reality_core"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true
bytes.workspace = true
uuid.workspace = true
url.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
md-5.workspace = true
hex.workspace = true
# Распаковка сертификатов, сжатых zlib и zstd (Firefox, Safari заявляют
# эти алгоритмы) — чистый Rust, без C-библиотек.
miniz_oxide = "0.9"
ruzstd = "0.9"
pin-project-lite.workspace = true
async-tungstenite.workspace = true
ws_stream_tungstenite.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
h2.workspace = true
quinn.workspace = true
h3.workspace = true
h3-quinn.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
http.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
base64.workspace = true
x509-parser.workspace = true
rand.workspace = true
zeroize.workspace = true
ml-kem.workspace = true
aws-lc-rs.workspace = true
brotli-decompressor.workspace = true
regex.workspace = true
hickory-proto.workspace = true
yaml_serde.workspace = true
tun-rs.workspace = true
netstack-smoltcp.workspace = true
socket2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

[dev-dependencies]
# В тестах серверу нужно уметь СЖИМАТЬ сертификат (проверка нашего
# распаковщика brotli); в сам клиент компрессор не попадает.
rustls = { workspace = true, features = ["brotli"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
rcgen = "0.14"
tracing-subscriber.workspace = true
