# Фаззинг парсеров ядра (fuzz/, cargo-fuzz + libFuzzer): каждую ночь и
# вручную — по 5 минут на цель. Находка — артефакт crash-* в прогоне;
# воспроизвести: cargo +nightly fuzz run -O <цель> <файл>.
name: Fuzz

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [srs, http1_head, socks5, vless_uri, sniff, sniff_quic, xudp, mux, subscription]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-fuzz
      # rss_limit_mb ловит раздувание памяти (как бомба подсетей .srs, R4).
      - name: ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run -O ${{ matrix.target }} -- -max_total_time=300 -max_len=65536 -rss_limit_mb=2048
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
