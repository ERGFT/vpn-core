# Фаззинг парсеров ядра (fuzz/, cargo-fuzz + libFuzzer): каждую ночь и
# вручную — по 5 минут на цель. Находка — артефакт crash-* в прогоне;
# воспроизвести: cargo +nightly fuzz run -O <цель> <файл>.
name: Fuzz

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [srs, http1_head, socks5, vless_uri, sniff, sniff_quic, xudp, mux, subscription]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-fuzz
      # rss_limit_mb ловит раздувание памяти (как бомба подсетей .srs, R4).
      # --target явно: cargo-fuzz из install-action собран под musl и по
      # умолчанию собирает цели под свою платформу, а std для musl в
      # тулчейне нет (E0463).
      - name: ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300 -max_len=65536 -rss_limit_mb=2048
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
