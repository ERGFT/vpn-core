# Выпуск: git tag v0.1.0 && git push origin v0.1.0 (тег — v + version из
# Cargo.toml; первый стабильный выпуск — v0.1.0, см. CHANGELOG.md). К CLI
# прикладываются SDK-пакеты C ABI для Linux, Windows, macOS, Android и iOS.
#
# Права: сборка (чужие actions, зависимости, build.rs) — только чтение;
# запись в репозиторий и подпись происхождения (attestation, keyless
# через OIDC GitHub) есть лишь у отдельного шага публикации, который
# ничего не собирает. К релизу — SBOM (CycloneDX) клиента; проверка
# подписи: gh attestation verify <файл> --repo ERGFT/vpn-core. Сторонние actions закреплены на коммитах (тег —
# в комментарии; обновляет dependabot).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ffi/**
      - scripts/package_ffi_sdk.py
      - scripts/check_ffi_sdk.py
      - scripts/test_check_ffi_sdk.py
      - Cargo.lock
      - Cargo.toml

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin: target/release/reality-client.exe
            asset: reality-client-windows-x86_64.exe
          - os: ubuntu-latest
            bin: target/release/reality-client
            asset: reality-client-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
        if: runner.os == 'Windows'
      - run: cargo build --release --locked -p reality-client
      - name: имя файла и SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      # Лицензии — один раз, в Linux-сборке (у Windows тот же Cargo.lock).
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-about@0.9.2,cargo-cyclonedx@0.5.9
      - name: LICENSE и лицензии зависимостей
        if: runner.os == 'Linux'
        run: |
          bash scripts/third_party_licenses.sh dist/THIRD-PARTY-LICENSES.html
          cp LICENSE dist/
      # SBOM — один на обе сборки (--target all: зависимости и Linux, и
      # Windows); cargo-cyclonedx пишет файл рядом с Cargo.toml.
      - name: SBOM (CycloneDX)
        if: runner.os == 'Linux'
        run: |
          cargo cyclonedx -q --manifest-path bin/client/Cargo.toml --format json \
            --target all --spec-version 1.5 --override-filename reality-client.sbom
          mv bin/client/reality-client.sbom.json dist/reality-client.sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            platform: android-arm64-v8a
            target: aarch64-linux-android
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            platform: ios-arm64
            target: aarch64-apple-ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
        if: runner.os == 'Windows'
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        if: matrix.platform == 'android-arm64-v8a'
        with:
          tool: cargo-ndk
      - name: Собрать FFI для Android
        if: matrix.platform == 'android-arm64-v8a'
        run: cargo ndk -t arm64-v8a build --locked --release -p reality-ffi
      - name: Собрать FFI для iOS
        if: matrix.platform == 'ios-arm64'
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: cargo build --locked --release -p reality-ffi --target ${{ matrix.target }}
      - name: Собрать FFI для macOS
        if: matrix.platform == 'macos-arm64'
        run: cargo build --locked --release -p reality-ffi --target ${{ matrix.target }}
      - name: Собрать FFI для Linux и Windows
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'windows-x86_64'
        run: cargo build --locked --release -p reality-ffi
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        if: matrix.platform == 'linux-x86_64'
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: SBOM SDK (CycloneDX)
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p dist
          cargo cyclonedx -q --manifest-path ffi/Cargo.toml --format json \
            --target all --spec-version 1.5 --override-filename reality-ffi.sbom
          mv ffi/reality-ffi.sbom.json dist/reality-ffi.sbom.cdx.json
      - name: Упаковать SDK
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          case "$PLATFORM" in
            linux-x86_64)
              python scripts/package_ffi_sdk.py --platform "$PLATFORM" --version "$VERSION" --output dist --library target/release/libreality.so --library target/release/libreality.a
              ;;
            windows-x86_64)
              python scripts/package_ffi_sdk.py --platform "$PLATFORM" --version "$VERSION" --output dist --library target/release/reality.dll --library target/release/reality.dll.lib --library target/release/reality.lib
              ;;
            android-arm64-v8a)
              python scripts/package_ffi_sdk.py --platform "$PLATFORM" --version "$VERSION" --output dist --library target/aarch64-linux-android/release/libreality.so --library target/aarch64-linux-android/release/libreality.a
              ;;
            ios-arm64)
              python scripts/package_ffi_sdk.py --platform "$PLATFORM" --version "$VERSION" --output dist --library target/aarch64-apple-ios/release/libreality.a
              ;;
            macos-arm64)
              python scripts/package_ffi_sdk.py --platform "$PLATFORM" --version "$VERSION" --output dist --library target/aarch64-apple-darwin/release/libreality.dylib --library target/aarch64-apple-darwin/release/libreality.a
              ;;
          esac
      - name: Проверить состав SDK и checksum
        run: python scripts/check_ffi_sdk.py ${{ matrix.platform }} dist/vpn-core-sdk-${{ matrix.platform }}.zip
      - name: Проверить обнаружение повреждённых архивов
        if: matrix.platform == 'linux-x86_64'
        run: python scripts/test_check_ffi_sdk.py
      - name: Проверить использование распакованного SDK на Linux
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          unzip -q dist/vpn-core-sdk-linux-x86_64.zip -d "$work"
          cd "$work/vpn-core-sdk"
          cc -I include examples/minimal.c -L lib -lreality -o "$work/minimal"
          LD_LIBRARY_PATH="$PWD/lib" "$work/minimal"
      - name: Проверить использование распакованного SDK на macOS
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          unzip -q dist/vpn-core-sdk-macos-arm64.zip -d "$work"
          cd "$work/vpn-core-sdk"
          cc -I include examples/minimal.c lib/libreality.dylib -Wl,-rpath,"$PWD/lib" -o "$work/minimal"
          DYLD_LIBRARY_PATH="$PWD/lib" "$work/minimal"
      - name: Проверить использование распакованного SDK на Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'sdk-consumer'
          Expand-Archive dist/vpn-core-sdk-windows-x86_64.zip -DestinationPath $work
          $sdk = Join-Path $work 'vpn-core-sdk'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC tools not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = "call `"$devcmd`" -no_logo -arch=x64 && cl /nologo /I`"$sdk\include`" `"$sdk\examples\minimal.c`" `"$sdk\lib\reality.dll.lib`" /Fe:`"$work\minimal.exe`""
          Push-Location $work
          cmd /c $command
          Pop-Location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$sdk/lib;$env:PATH"
          & "$work/minimal.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверить заголовок и символы мобильного SDK
        if: matrix.platform == 'android-arm64-v8a' || matrix.platform == 'ios-arm64'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          unzip -q "dist/vpn-core-sdk-$PLATFORM.zip" -d "$work"
          cd "$work/vpn-core-sdk"
          if [ "$PLATFORM" = android-arm64-v8a ]; then
            clang="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            "$clang" -I include examples/minimal.c lib/libreality.so -o "$work/minimal"
          else
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=13.0 -I include examples/minimal.c lib/libreality.a -framework Security -framework SystemConfiguration -framework CoreFoundation -liconv -lresolv -o "$work/minimal"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, sdk]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless-подпись происхождения
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          name: vpn-core ${{ github.ref_name }}
          body: |
            Версионированный выпуск vpn-core: `${{ github.ref_name }}`.

            Помимо CLI, релиз содержит SDK C ABI для встраивания ядра в приложения:
            Linux x86_64, Windows x86_64, macOS arm64, Android arm64-v8a и iOS arm64.
            В SDK входят готовая библиотека, заголовок `reality.h`, минимальный
            пример на C и руководства по API и интеграции. SHA-256 checksums,
            CycloneDX SBOM и build provenance приложены к файлам релиза.

            Встраивание распространяется по GPL-3.0-or-later. Перед включением
            ядра в приложение проверьте требования лицензии и приложите лицензии
            зависимостей из этого релиза.

            Интеграция: [руководство C ABI](https://github.com/ERGFT/vpn-core/blob/${{ github.ref_name }}/docs/LIBRARY.md).
            [Журнал изменений](https://github.com/ERGFT/vpn-core/blob/${{ github.ref_name }}/CHANGELOG.md).

            Ограничения проверки: Android/iOS SDK собраны и cross-linked, но не
            запускались на реальных устройствах. Системный прокси и автозапуск
            Windows, а также interop с Xray-core проверялись под Wine. REALITY
            не проходил независимое стороннее криптографическое ревью.
          fail_on_unmatched_files: true
          files: dist/*
