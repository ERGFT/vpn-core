# Выпуск: git tag v0.1.0 && git push origin v0.1.0 (тег — v + version из
# Cargo.toml; первый выпуск — v0.1.0, см. CHANGELOG.md) — собирает .exe для
# Windows и бинарник для Linux и прикладывает их к релизу (черновику)
# вместе с LICENSE и лицензиями зависимостей (THIRD-PARTY-LICENSES.html).
#
# Права: сборка (чужие actions, зависимости, build.rs) — только чтение;
# запись в репозиторий и подпись происхождения (attestation, keyless
# через OIDC GitHub) есть лишь у отдельного шага публикации, который
# ничего не собирает. К релизу — SBOM (CycloneDX) клиента; проверка
# подписи: gh attestation verify <файл> --repo ERGFT/vpn-core. Сторонние actions закреплены на коммитах (тег —
# в комментарии; обновляет dependabot).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            bin: target/release/reality-client.exe
            asset: reality-client-windows-x86_64.exe
          - os: ubuntu-latest
            bin: target/release/reality-client
            asset: reality-client-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
        if: runner.os == 'Windows'
      - run: cargo build --release --locked -p reality-client
      - name: имя файла и SHA-256
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      # Лицензии — один раз, в Linux-сборке (у Windows тот же Cargo.lock).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-about@0.9.2,cargo-cyclonedx@0.5.9
      - name: LICENSE и лицензии зависимостей
        if: runner.os == 'Linux'
        run: |
          bash scripts/third_party_licenses.sh dist/THIRD-PARTY-LICENSES.html
          cp LICENSE dist/
      # SBOM — один на обе сборки (--target all: зависимости и Linux, и
      # Windows); cargo-cyclonedx пишет файл рядом с Cargo.toml.
      - name: SBOM (CycloneDX)
        if: runner.os == 'Linux'
        run: |
          cargo cyclonedx -q --manifest-path bin/client/Cargo.toml --format json \
            --target all --spec-version 1.5 --override-filename reality-client.sbom
          mv bin/client/reality-client.sbom.json dist/reality-client.sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless-подпись происхождения
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/reality-client-*-x86_64*
            dist/reality-client.sbom.cdx.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
