# Предварительные сборки для разработчиков: один prerelease на каждый коммит
# main, только после успешного CI. Теги dev-* не запускают стабильный release.yml.
# workflow_run имеет доступ к записи, поэтому собираем только доверенный push
# в main, проверяем репозиторий-источник и checkout делаем строго по head_sha.
name: Developer release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dev-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/reality-client.exe
            asset: reality-client-windows-x86_64.exe
          - os: ubuntu-latest
            bin: target/release/reality-client
            asset: reality-client-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
        if: runner.os == 'Windows'
      - run: cargo build --release --locked -p reality-client
      - name: бинарник, контрольная сумма и commit
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BUILD_OS: ${{ runner.os }}
        run: |
          mkdir dist
          cp "${{ matrix.bin }}" "dist/${{ matrix.asset }}"
          cd dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          printf '%s\n' "$SOURCE_COMMIT" > "COMMIT-${BUILD_OS}.txt"
      # Лицензии и SBOM собираются один раз; Cargo.lock одинаков для обеих платформ.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-about@0.9.2,cargo-cyclonedx@0.5.9
      - name: LICENSE и лицензии зависимостей
        if: runner.os == 'Linux'
        run: |
          bash scripts/third_party_licenses.sh dist/THIRD-PARTY-LICENSES.html
          cp LICENSE dist/
      - name: SBOM (CycloneDX)
        if: runner.os == 'Linux'
        run: |
          cargo cyclonedx -q --manifest-path bin/client/Cargo.toml --format json \
            --target all --spec-version 1.5 --override-filename reality-client.sbom
          mv bin/client/reality-client.sbom.json dist/reality-client.sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/reality-client-*-x86_64*
            dist/reality-client.sbom.cdx.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: dev-${{ github.event.workflow_run.head_sha }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Developer build ${{ github.event.workflow_run.head_sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Предварительная сборка для разработчиков. Не является стабильным выпуском.

            Сборка создана после успешного CI для коммита `${{ github.event.workflow_run.head_sha }}`.
            Файлы включают SHA-256, SBOM, лицензии и attestation происхождения.

            Проверить attestation: `gh attestation verify <файл> --repo ERGFT/vpn-core`.
          files: dist/*
