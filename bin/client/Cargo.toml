[package]
name = "reality-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Клиент VLESS (+REALITY, +XTLS Vision): локальный SOCKS5/HTTP-прокси и TUN"

[[bin]]
name = "reality-client"
path = "src/main.rs"

[dependencies]
reality-core = { path = "../../core" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc = { version = "0.1.52", optional = true }

[features]
mimalloc = ["dep:mimalloc"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Networking_WinInet", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_Storage_FileSystem"] }
windows-service = "0.8"
