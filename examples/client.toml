# Пример файла настроек reality-client:  reality-client --config client.toml
#
# Относительные пути — от папки этого файла. Пути Windows пишите в
# одинарных кавычках: link_file = 'C:\Users\me\server.txt' (в двойных
# «\» — начало спецсимвола). Секреты (ссылку на сервер,
# пароль прокси) держите в отдельных файлах: тогда сам этот файл можно
# спокойно показывать и хранить. Опечатка в имени поля — ошибка при
# запуске, а не молчаливое «не задано».
#
# Проверить настройки, ничего не запуская:  reality-client --config client.toml --check

# ── Входы: куда подключаются приложения ─────────────────────────────
[[inbounds]]
type = "mixed"                 # SOCKS5 и HTTP на одном порту ("socks", "http" — по отдельности)
tag = "local"
listen = "127.0.0.1:1080"      # только этот компьютер
# auth_file = "auth.txt"       # логин:пароль в первой строке
# max_conns = 512
sniff = true                   # домен по TLS SNI / HTTP Host, когда приложение прислало IP
# sniff_override_destination = true   # и отдавать серверу домен вместо IP

# Второй вход для телефона в домашней сети. В сеть — только с паролем
# (не короче 12 символов) и лучше со списком своих устройств.
# [[inbounds]]
# type = "mixed"
# tag = "lan"
# listen = "0.0.0.0:1081"
# auth_file = "lan-auth.txt"
# allow_ip = ["192.168.1.23", "192.168.1.40"]

# ── Выходы: куда уходят соединения ──────────────────────────────────
[[outbounds]]
tag = "proxy"
type = "vless"
link_file = "server.txt"       # vless://… в первой строке (или link = "vless://…")
# xudp = true                  # UDP через XUDP (как у Xray); false — поток на назначение
# ca_file = "ca.pem"           # свои корневые сертификаты для security=tls
# allow_insecure = false       # разрешить security=none (без шифрования)

[[outbounds]]
tag = "direct"                 # напрямую, без сервера
type = "direct"

[[outbounds]]
tag = "block"                  # сразу отказать
type = "block"

# ── Маршрутизация ───────────────────────────────────────────────────
# Правила проверяются по порядку, срабатывает первое подошедшее.
# В одном правиле: (домен ИЛИ адрес) И порт И сеть И вход.
# geosite/geoip — базы v2fly: geosite.dat (dlc.dat из
# github.com/v2fly/domain-list-community/releases) и geoip.dat
# (github.com/v2fly/geoip/releases), по умолчанию — рядом с этим файлом.

[[route.rules]]                # реклама и трекеры
geosite = ["category-ads-all"]
outbound = "block"

[[route.rules]]                # локальная сеть — напрямую
ip_is_private = true
outbound = "direct"

[[route.rules]]                # российские сайты и адреса — напрямую
geosite = ["category-ru"]
geoip = ["ru"]
outbound = "direct"

# [[route.rules]]              # QUIC (HTTP/3) запретить: браузер уйдёт на TCP
# network = "udp"
# port = [443]
# outbound = "block"

# Другие условия: domain (точно), domain_suffix (и поддомены; с точкой
# впереди — только поддомены), domain_keyword, domain_regex, ip_cidr,
# port (443 или "1000-2000"), network ("tcp"/"udp"), inbound (tag входов).

[route]
final = "proxy"                # всё остальное — через сервер
# geosite_file = "geosite.dat"
# geoip_file = "geoip.dat"
