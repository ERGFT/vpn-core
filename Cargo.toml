[workspace]
resolver = "2"
members = [
    "core",
    "bin/client",
    "bin/fpcheck",
    "ffi",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Минимальная версия Rust (MSRV): ниже не дают зависимости (aes — 1.89;
# time, icu_*, libloading — 1.88); проверяется в CI (job msrv).
rust-version = "1.89"
license = "GPL-3.0-or-later"
authors = ["ERGFT"]
repository = "https://github.com/ERGFT/vpn-core"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
regex = "1"
yaml_serde = "0.10"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
tun-rs = { version = "2.8", features = ["async_tokio"] }
# TCP/IP-стек входа TUN: smoltcp через netstack-smoltcp (приём соединений
# на любой адрес). Раньше — ipstack 1.0: после потери пакетов его TCP
# вставал навсегда (сегмент не по порядку оставался позади `ack`, не было
# дублирующих ACK), а сегменты были по 536 байт — без MSS в SYN-ACK.
netstack-smoltcp = "0.2.4"
socket2 = { version = "0.6", features = ["all"] }

# Этап 3: снятие/расчёт TLS-фингерпринта (JA3/JA4) — измерение того, что
# реально уходит в сеть, а не подмена (см. PLAN.md, Этап 3: rustls не
# даёт менять порядок cipher suite/extensions и не умеет GREASE).
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4"
pin-project-lite = "0.2"

# Этап 4: транспорты поверх готовых библиотек, не самописный фреймер.
# ws_stream_tungstenite хочет futures_io::AsyncRead/Write на входе (её
# внутренний async-tungstenite так устроен) и tokio::io на выходе
# (feature "tokio_io") — мост между ними даёт tokio-util::compat.
async-tungstenite = { version = "0.29", default-features = false, features = ["futures-03-sink", "handshake"] }
ws_stream_tungstenite = { version = "0.15", features = ["tokio_io"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", features = ["sink"] }
h2 = "0.4"
# QUIC (DNS over QUIC, xhttp через HTTP/3): quinn с той же rustls/aws-lc,
# что и остальной TLS; HTTP/3 — h3 поверх quinn.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
http = "1"

# Этап 5: REALITY — крипто-примитивы клиентской части (X25519 ECDH,
# HKDF-SHA256, AES-256-GCM, HMAC-SHA512) и разбор Ed25519-сертификата
# сервера. Одно поколение RustCrypto (digest 0.11, rand_core 0.10 — как у
# ml-kem ниже): sha2/md-5 0.11, hkdf/hmac 0.13, aes-gcm 0.11,
# x25519-dalek 3, rand 0.10 обновляются только вместе, с интероп-тестами
# против Xray-core (scripts/ci.sh).
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
hkdf = "0.13"
hmac = "0.13"
aes-gcm = "0.11"
base64 = "0.23"
x509-parser = "0.18"
# Крипто-ревью (см. PLAN.md, Этап 5): секреты, которые живут дольше
# одной функции (эфемерный X25519-скаляр и общий секрет в
# `reality/hook.rs`), должны сами стираться из памяти при Drop, а не
# полагаться на то, что ОС когда-нибудь переиспользует эту страницу.
# Feature "zeroize" у x25519-dalek включает это для его собственных
# типов (`StaticSecret`/`SharedSecret`) без единой строчки кода с нашей
# стороны; `zeroize` как прямая зависимость — для полей, которые мы
# храним сами (`[u8; 32]`, которые dalek не оборачивает).
zeroize = "1"

# ML-DSA-65 (`pqv=` у REALITY): проверка постквантовой подписи сервера.
# Та же библиотека aws-lc, что уже выполняет всю TLS-криптографию
# (через rustls) — новой криптографической зависимости не добавляется,
# только прямая ссылка на неё.
aws-lc-rs = "1"

# Распаковка сжатых сертификатов (RFC 8879): Chrome заявляет
# compress_certificate с brotli, без этого наш ClientHello отличался от
# браузера (решение пользователя: добавить зависимость). Только
# распаковщик — фича "brotli" у rustls тащила бы ещё и компрессор
# (+1,3 МБ к бинарнику при нулевой пользе для клиента).
brotli-decompressor = "6"

# Этап 5 — находка после первой "полной" версии REALITY: современные
# серверы Xray-core (26.9.8+) требуют гибридную постквантовую группу
# `X25519MLKEM768` в key_share ClientHello, не голый X25519 (см. PLAN.md
# за независимо подтверждёнными багрепортами других REALITY-клиентов).
# `ml-kem` — pure-Rust реализация ML-KEM (FIPS 203) от RustCrypto, того
# же семейства крейтов, что `hkdf`/`hmac`/`x25519-dalek` уже в проекте —
# осознанный выбор в пользу консистентности инструментария, а не
# "первое, что нашлось". Байты encapsulation key/ciphertext/shared key
# сверены вручную против стандартных размеров FIPS 203 (1184/1088/32) —
# см. `reality/hook.rs`. Feature "zeroize" — та же дисциплина, что и для
# x25519-dalek выше (стирание DecapsulationKey при Drop); "getrandom" —
# генерация ключей и encapsulate() берут случайность напрямую из ОС.
ml-kem = { version = "0.3", features = ["zeroize", "getrandom"] }

# Патченный rustls 0.23.45 (vendor/rustls-reality-patch): хук REALITY
# (своя доля X25519MLKEM768, печать session_id), сборка ClientHello по
# профилю браузера, GREASE, дополнительная доля P-256. Это существенная
# правка логики рукопожатия (~800 строк в 13 файлах), а не только
# видимости: весь объём — vendor/rustls-reality-patch.diff
# (scripts/rustls_patch.sh), что изменено и как переносить обновления
# безопасности rustls — docs/RUSTLS_PATCH.md. Подменяет rustls во всём
# графе (включая tokio-rustls); версия закреплена, dependabot её не
# обновляет.
#
# smoltcp 0.12.0 (стек входа TUN, через netstack-smoltcp) с одной правкой
# из smoltcp 0.13 (#1079): данные сверх объявленного окна приёма
# отвергаются. Без неё такие данные роняли стек паникой «attempt to
# subtract sequence numbers with underflow», и TUN останавливался. 0.13
# требует Rust 1.91 (у нас MSRV 1.89), а netstack-smoltcp — 0.12. Патч —
# vendor/smoltcp-window-patch.diff (scripts/vendor_patch.sh smoltcp),
# убрать его — при переходе на smoltcp ≥ 0.13.
[patch.crates-io]
rustls = { path = "vendor/rustls-reality-patch" }
smoltcp = { path = "vendor/smoltcp-window-patch" }

# panic = "unwind" (по умолчанию), не "abort": профиль общий и для
# библиотеки (ffi), где catch_unwind не даёт панике выйти за границу C и
# уронить приложение-хост; и в клиенте паника в задаче tokio закрывает
# одно соединение, а не весь VPN.
[profile.release]
lto = true
codegen-units = 1
strip = true
